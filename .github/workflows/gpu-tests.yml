name: GPU tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-tests:
    # Do not execute this workflow when manually dispatched from a feature ref.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Self-hosted Windows x64 runner with the custom `gpu` label.
    runs-on: [self-hosted, windows, x64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Intentionally run trusted default-branch code only on the private runner.
          # Feature branches require manual local GPU validation before merging.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the preinstalled GPU environment
        run: |
          nvidia-smi
          python -c "import torch, flash_attn, triton; assert torch.cuda.is_available(); print('PyTorch:', torch.__version__, 'FlashAttention:', flash_attn.__version__, 'Triton:', triton.__version__, 'GPU:', torch.cuda.get_device_name())"
      - name: Install tests without replacing the CUDA dependencies
        run: |
          python -m pip install 'pytest>=8' 'pytest-cov>=5' 'build>=1.2' 'hatchling>=1.27'
          python -m pip install -e . --no-deps
      - name: Run full CUDA and fusion suites (skip-free prerequisites required)
        run: python -m pytest --require-cuda --require-fusion --junitxml=gpu-test-results.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-test-report
          path: gpu-test-results.xml

name: GPU tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-tests:
    # Register a dedicated Linux NVIDIA runner and add the custom `gpu` label.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Always run trusted default-branch code on the self-hosted machine.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the preinstalled GPU environment
        run: |
          nvidia-smi
          python -c "import torch, flash_attn; assert torch.cuda.is_available(); print('PyTorch:', torch.__version__, 'FlashAttention:', flash_attn.__version__, 'GPU:', torch.cuda.get_device_name())"
      - name: Install tests without replacing the CUDA dependencies
        run: |
          python -m pip install 'pytest>=8' 'pytest-cov>=5' 'build>=1.2' 'hatchling>=1.27'
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Run both suites with the real CUDA backend required
        run: python -m pytest --require-cuda --junitxml=gpu-test-results.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-test-report
          path: gpu-test-results.xml

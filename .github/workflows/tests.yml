name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -m 'not cuda' --cov=varlen_transformer --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Build distributions
        run: python -m build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-reports-python-${{ matrix.python }}
          path: |
            coverage.xml
            test-results.xml
